<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPRS Account Action</title>
</head>
<body style="margin:0;padding:0;background:#151520;font-family:'Poppins',Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#151520;padding:30px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#2a2a3d;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="padding:42px 28px 22px;text-align:center;">
              <h1 style="margin:0;font-size:44px;line-height:1;color:#d63d86;font-weight:700;letter-spacing:2px;">TPRS</h1>
              <p style="margin:10px 0 0;color:#b5b5cc;font-size:14px;font-weight:600;letter-spacing:0.3px;">Thesis and Project Repository System</p>
              <h2 style="margin:24px 0 8px;font-size:24px;line-height:1.3;color:#d63d86;font-weight:700;">{{SUBJECT_TITLE}}</h2>
              <p style="margin:0;color:#b5b5cc;font-size:15px;line-height:1.6;">Hi {{GREETING_NAME}},</p>
              <p style="margin:10px 0 0;color:#e2e2ea;font-size:15px;line-height:1.7;">{{BODY_TEXT}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 10px;text-align:center;">
              <a href="{{ACTION_URL}}" style="display:inline-block;background:#d63d86;color:#ffffff;text-decoration:none;padding:13px 26px;border-radius:10px;font-weight:600;letter-spacing:0.4px;box-shadow:0 8px 20px rgba(214,61,134,0.35);">{{BUTTON_TEXT}}</a>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 24px;">
              <p style="margin:0 0 8px;color:#b5b5cc;font-size:13px;line-height:1.5;">{{ALT_TEXT}}</p>
              <p style="margin:0;word-break:break-all;color:#d9d9e8;font-size:12px;line-height:1.6;">{{ACTION_URL}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:14px 28px;background:#252538;color:#8f8fa8;font-size:12px;text-align:center;">
              Copyright © 2026 <br> Thesis &amp; Project Repository System
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
