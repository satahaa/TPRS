<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPRS - Account Action</title>
    <link rel="stylesheet" href="/styles/auth-action.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="/scripts/firebase-config.js"></script>
</head>
<body>
    <div class="action-container">
        <div class="action-card">
            <div class="brand-header">
                <div class="brand-icon"><span class="material-icons" id="headerIcon">verified_user</span></div>
                <h1 id="title">Processing Action</h1>
                <p id="subtitle">Please wait...</p>
            </div>

            <div id="message" class="message" role="status" aria-live="polite"></div>

            <form id="resetForm" class="hidden" novalidate autocomplete="on">
                <input type="email" id="resetEmail" name="email" autocomplete="username" tabindex="-1" aria-hidden="true" class="sr-only" readonly>

                <div class="input-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-with-icon">
                        <input type="password" id="newPassword" name="new-password" minlength="6" required autocomplete="new-password" placeholder="Enter new password">
                        <span class="material-icons toggle-password" id="togglePasswordsIcon" aria-label="Show passwords">visibility</span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="new-password-confirm" minlength="6" required autocomplete="new-password" placeholder="Confirm new password">
                </div>

                <button type="submit" id="resetBtn">
                    <span class="material-icons">check_circle</span>
                    Update Password
                </button>
            </form>

            <p class="helper-text">
                Return to <a href="/html/login.html">Login</a>
            </p>
        </div>
    </div>

    <script src="/scripts/auth-action.js?v=1"></script>
</body>
</html>
