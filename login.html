<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPRS - Login</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23d63d86'%3E%3Cpath d='M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="api.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="brand-header">
                <div class="brand-icon">
                    <span class="material-icons">school</span>
                </div>
                <h1 class="brand-title">TPRS</h1>
                <p class="brand-subtitle">Thesis and Project Repository System</p>
            </div>
            <form id="loginForm" autocomplete="off">
                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon material-icons">email</span>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="off">
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon material-icons">lock</span>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <span class="toggle-password" onclick="togglePassword()">
                            <span class="material-icons" id="toggleIcon">visibility</span>
                        </span>
                    </div>
                </div>
                <div class="options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password" id="forgotPassLink">Forgot Password?</a>
                </div>
                <button type="submit" class="login-btn">
                    <span class="material-icons">login</span>
                    Sign In
                </button>
                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>
            </form>
            <div class="signup-link">
                <p>Don't have an account? <a href="signup.html">Sign up</a></p>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }

        // Form submission handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            // Clear previous error messages
            errorMessage.textContent = '';
            errorMessage.classList.remove('show');
            
            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('Please enter a valid email address');
                return;
            }
            
            // Password validation (minimum 6 characters)
            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }
            
            // Show loading state
            const loginBtn = document.querySelector('.login-btn');
            const originalBtnContent = loginBtn.innerHTML;
            loginBtn.innerHTML = '<span class="material-icons">hourglass_empty</span> Signing in...';
            loginBtn.disabled = true;
            
            try {
                // Call backend API - auto-detects role by email
                let result;
                
                // 1. Check if it's an admin login direct to backend
                const backendResult = await TPRSApi.login(email, password);
                
                if (backendResult.success && backendResult.userType === 'admin') {
                    // Admin successfully logged in via db.properties
                    result = backendResult;
                } else if (backendResult.isAdminEmail) {
                    // Admin entered wrong password, bypass Firebase completely
                    showError("Incorrect credentials");
                    loginBtn.innerHTML = originalBtnContent;
                    loginBtn.disabled = false;
                    return;
                } else {
                    // 2. Normal user login via Firebase Auth
                    try {
                        const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                        if (userCredential.user.emailVerified === false) {
                            showError("Please verify your email address. Check your inbox.");
                            await firebase.auth().signOut();
                            loginBtn.innerHTML = originalBtnContent;
                            loginBtn.disabled = false;
                            return;
                        }
                        const idToken = await userCredential.user.getIdToken();
                        result = await TPRSApi.loginWithToken(idToken);
                    } catch (firebaseErr) {
                        if (firebaseErr.code === 'auth/invalid-credential' || firebaseErr.code === 'auth/wrong-password' || firebaseErr.code === 'auth/user-not-found') {
                            showError("Incorrect credentials");
                        } else {
                            showError("Firebase Login failed: " + firebaseErr.message);
                        }
                        loginBtn.innerHTML = originalBtnContent;
                        loginBtn.disabled = false;
                        return;
                    }
                }
                if (result && result.success) {
                    // Successful login - save session with detected role
                    TPRSApi.saveSession(result.user, result.userType);
                    
                    // Handle remember me
                    if (document.getElementById('remember').checked) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }
                    
                    // Redirect based on role (use backend redirect or fallback)
                    const redirectPage = result.redirect || (result.userType === 'teacher' ? 'supervisor-dashboard.html' : 'home.html');
                    window.location.href = redirectPage;
                } else {
                    // Login failed
                    showError(result.message || 'Invalid email or password');
                    loginBtn.innerHTML = originalBtnContent;
                    loginBtn.disabled = false;
                }
            } catch (error) {
                // Network or server error - fallback to localStorage for demo
                console.log('API not available, using local storage fallback');
                
                const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                const user = registeredUsers.find(u => u.email === email && u.password === password);
                
                if (user) {
                    // Successful login from localStorage
                    if (document.getElementById('remember').checked) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }
                    
                    const userType = user.role === 'teacher' ? 'teacher' : 'student';
                    TPRSApi.saveSession(user, userType);
                    
                    window.location.href = userType === 'teacher' ? 'supervisor-dashboard.html' : userType === 'admin' ? 'admin-dashboard.html' : 'home.html';
                } else {
                    showError('Invalid email or password');
                    loginBtn.innerHTML = originalBtnContent;
                    loginBtn.disabled = false;
                }
            }
        });

        // Forgot Password
        document.getElementById("forgotPassLink").addEventListener("click", async function(e) {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            if (!email) {
                showError("Enter your email address first");
                return;
            }
            try {
                await firebase.auth().sendPasswordResetEmail(email);
                showSuccess("Password reset email sent. Check your inbox.");
            } catch (err) {
                showError("Forgot Password failed: " + err.message);
            }
        });

        // Show error message
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            successMessage.classList.remove('show');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        // Show success message
        function showSuccess(message) {
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            errorMessage.classList.remove('show');
            successMessage.textContent = message;
            successMessage.classList.add('show');
        }

        // Check for remembered email on page load
        window.addEventListener('load', function() {
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                document.getElementById('remember').checked = true;
            }
        });

        // Check if already logged in
        if (TPRSApi.isLoggedIn()) {
            const userType = TPRSApi.getUserType();
            window.location.href = userType === 'teacher' ? 'supervisor-dashboard.html' : userType === 'admin' ? 'admin-dashboard.html' : 'home.html';
        }
    </script>
</body>
</html>
