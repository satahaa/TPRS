<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPRS - Login</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="api.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="brand-header">
                <div class="brand-icon">
                    <span class="material-icons">school</span>
                </div>
                <h1 class="brand-title">TPRS</h1>
                <p class="brand-subtitle">Thesis and Project Repository System</p>
            </div>
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon material-icons">email</span>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon material-icons">lock</span>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <span class="toggle-password" onclick="togglePassword()">
                            <span class="material-icons" id="toggleIcon">visibility</span>
                        </span>
                    </div>
                </div>
                <div class="options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>
                <button type="submit" class="login-btn">
                    <span class="material-icons">login</span>
                    Sign In
                </button>
                <div class="error-message" id="errorMessage"></div>
            </form>
            <div class="signup-link">
                <p>Don't have an account? <a href="signup.html">Sign up</a></p>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }

        // Form submission handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            // Clear previous error messages
            errorMessage.textContent = '';
            errorMessage.classList.remove('show');
            
            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('Please enter a valid email address');
                return;
            }
            
            // Password validation (minimum 6 characters)
            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }
            
            // Show loading state
            const loginBtn = document.querySelector('.login-btn');
            const originalBtnContent = loginBtn.innerHTML;
            loginBtn.innerHTML = '<span class="material-icons">hourglass_empty</span> Signing in...';
            loginBtn.disabled = true;
            
            try {
                // Call backend API for authentication
                const result = await TPRSApi.login(email, password, 'student');
                
                if (result.success) {
                    // Successful login - save session
                    TPRSApi.saveSession(result.user, result.userType);
                    
                    // Handle remember me
                    if (document.getElementById('remember').checked) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }
                    
                    // Redirect to home page
                    window.location.href = 'home.html';
                } else {
                    // Login failed
                    showError(result.message || 'Invalid email or password');
                    loginBtn.innerHTML = originalBtnContent;
                    loginBtn.disabled = false;
                }
            } catch (error) {
                // Network or server error - fallback to localStorage for demo
                console.log('API not available, using local storage fallback');
                
                const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                const user = registeredUsers.find(u => u.email === email && u.password === password);
                
                if (user) {
                    // Successful login from localStorage
                    if (document.getElementById('remember').checked) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }
                    
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('userEmail', email);
                    sessionStorage.setItem('currentUser', JSON.stringify(user));
                    
                    window.location.href = 'home.html';
                } else {
                    showError('Invalid email or password');
                    loginBtn.innerHTML = originalBtnContent;
                    loginBtn.disabled = false;
                }
            }
        });

        // Show error message
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        // Check for remembered email on page load
        window.addEventListener('load', function() {
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                document.getElementById('remember').checked = true;
            }
        });

        // Check if already logged in
        if (TPRSApi.isLoggedIn()) {
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
